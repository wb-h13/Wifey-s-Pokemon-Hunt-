header{position:sticky;top:0;z-index:9;background:rgba(251,248,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 14px}
.title{font-size:22px;font-weight:800;margin:0 0 6px} .summary{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}

main{padding:0 12px 88px} .group{margin:12px 0 20px} .group h2{font-size:18px;margin:10px 3px 8px;color:var(--accent)}

.card.owned{opacity:.62} .card.owned .name{text-decoration:line-through} .empty{padding:40px 16px;text-align:center;color:var(--muted)}
footer{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(251,248,255,.96);border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}

function money(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP',maximumFractionDigits:0}).format(n)}
function render(){
 const q=document.querySelector('#q').value.trim().toLowerCase(); const col=document.querySelector('#collection').value; const f=document.querySelector('#filter').value;
 const filtered=cards.filter(c=>(!q||[c.name,c.set,c.num,c.form].join(' ').toLowerCase().includes(q))&&(!col||c.collection===col)&&(f==='all'||(f==='owned'&&c.owned)||(f==='need'&&!c.owned)));
 const groups={}; for(const c of filtered)(groups[c.collection]??=[]).push(c);
 const app=document.querySelector('#app'); app.innerHTML='';
 for(const [g,arr] of Object.entries(groups)){const sec=document.createElement('section');sec.className='group';sec.innerHTML=`<h2>${g}</h2>`;for(const c of arr){const d=document.createElement('div');d.className='card'+(c.owned?' owned':'');d.innerHTML=`<input class="tick" type="checkbox" ${c.owned?'checked':''}><div><div class="name">${c.name}</div><div class="meta">${c.set} · ${c.num}${c.form&&c.form!=='Normal'?' · '+c.form:''}</div></div><div class="price">${c.value?money(c.value):''}</div>`;d.querySelector('input').onchange=e=>{c.owned=e.target.checked;saved[c.id]=c.owned;localStorage.setItem(key,JSON.stringify(saved));render()};sec.appendChild(d)}app.appendChild(sec)}

}
['q','collection','filter'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));

function exportBackup(){
  const payload={app:'Wifeys Pokemon Hunt',version:1,exportedAt:new Date().toISOString(),owned:saved};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='wifeys-pokemon-hunt-backup.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader=new FileReader(); reader.onload=()=>{try{
    const data=JSON.parse(reader.result); const incoming=data.owned||data;
    if(!incoming || typeof incoming!=='object') throw new Error('Invalid backup');
    Object.keys(saved).forEach(k=>delete saved[k]); Object.assign(saved,incoming);
    localStorage.setItem(key,JSON.stringify(saved));
    for(const c of cards) c.owned=!!saved[c.id]; render(); alert('Backup restored ✓');
  }catch(e){alert('That backup file could not be read.');}}; reader.readAsText(file);
}
